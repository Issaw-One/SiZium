<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="shortcut icon" href="content.png" type="image/x-icon">
  <title>Enchères - SiZium Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="style.css">
  <style>
    .auctions-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .auctions-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .auctions-title {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
    }
    .create-auction-btn {
      padding: 12px 20px;
      border-radius: 14px;
      background: linear-gradient(135deg,rgba(53,242,255,.22),rgba(167,139,250,.22));
      border: 1px solid rgba(255,255,255,.16);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s;
    }
    .create-auction-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .auctions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .auction-card {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      padding: 20px;
      transition: transform .2s, box-shadow .2s;
    }
    .auction-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
    }
    .auction-image {
      width: 100%;
      height: 200px;
      border-radius: 16px;
      background: rgba(7,10,18,.55);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .auction-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .auction-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }
    .auction-description {
      color: rgba(255,255,255,.6);
      font-size: .9rem;
      margin-bottom: 12px;
      min-height: 40px;
    }
    .auction-bid-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: rgba(53,242,255,.08);
      border: 1px solid rgba(53,242,255,.2);
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .auction-bid-label {
      font-size: .85rem;
      color: rgba(255,255,255,.6);
    }
    .auction-bid-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--cyan);
    }
    .auction-timer {
      text-align: center;
      font-size: .9rem;
      color: rgba(255,255,255,.5);
      margin-bottom: 12px;
    }
    .auction-timer.ending {
      color: #fb7185;
      font-weight: 700;
    }
    .auction-actions {
      display: flex;
      gap: 10px;
    }
    .auction-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .auction-btn:hover {
      background: rgba(255,255,255,.1);
    }
    .auction-btn.primary {
      background: linear-gradient(135deg,rgba(53,242,255,.22),rgba(167,139,250,.22));
      border-color: rgba(255,255,255,.16);
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.open {
      display: flex;
    }
    .modal-content {
      background: rgba(10,14,26,.95);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      padding: 28px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 20px;
    }
    .form-field {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      margin-bottom: 8px;
      color: rgba(255,255,255,.7);
      font-weight: 600;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(7,10,18,.55);
      border: 1px solid rgba(255,255,255,.14);
      color: var(--text);
      outline: none;
      font-family: inherit;
    }
    .form-input:focus {
      border-color: rgba(53,242,255,.4);
    }
    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="wrap">
      <div class="brand">
        <img src="baf6edb7f1fdbf9518edb15ce85740c6.webp" alt="SiZium" class="logo" width="34" height="34">
        <div>SiZium<br><span class="small">Enchères</span></div>
      </div>
      <div class="actions">
        <a href="/" class="btn">← Retour boutique</a>
      </div>
    </div>
  </div>

  <div class="auctions-container">
    <div class="auctions-header">
      <div class="auctions-title">🏆 Enchères en cours</div>
      <button class="create-auction-btn" id="createAuctionBtn">+ Créer une enchère</button>
    </div>
    <div class="auctions-grid" id="auctionsGrid">
      <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: rgba(255,255,255,.5);">
        Chargement des enchères...
      </div>
    </div>
  </div>

  <!-- Create Auction Modal -->
  <div class="modal" id="createAuctionModal">
    <div class="modal-content">
      <div class="modal-title">Créer une enchère</div>
      <form id="createAuctionForm">
        <div class="form-field">
          <label class="form-label">Nom de l'item</label>
          <input type="text" class="form-input" id="itemName" required>
        </div>
        <div class="form-field">
          <label class="form-label">Image (URL)</label>
          <input type="url" class="form-input" id="itemImage">
        </div>
        <div class="form-field">
          <label class="form-label">Description</label>
          <textarea class="form-input form-textarea" id="itemDescription"></textarea>
        </div>
        <div class="form-field">
          <label class="form-label">Prix de départ ($)</label>
          <input type="number" class="form-input" id="startingBid" required min="1">
        </div>
        <div class="form-field">
          <label class="form-label">Incrément minimum ($)</label>
          <input type="number" class="form-input" id="minIncrement" value="1" min="1">
        </div>
        <div class="form-field">
          <label class="form-label">Date de fin</label>
          <input type="datetime-local" class="form-input" id="endTime" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="auction-btn" id="cancelCreate">Annuler</button>
          <button type="submit" class="auction-btn primary">Créer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bid Modal -->
  <div class="modal" id="bidModal">
    <div class="modal-content">
      <div class="modal-title">Placer une enchère</div>
      <form id="bidForm">
        <input type="hidden" id="bidAuctionId">
        <div class="form-field">
          <label class="form-label">Enchère actuelle: <span id="currentBidDisplay"></span>$</label>
        </div>
        <div class="form-field">
          <label class="form-label">Votre enchère (minimum: <span id="minBidDisplay"></span>$)</label>
          <input type="number" class="form-input" id="bidAmount" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="auction-btn" id="cancelBid">Annuler</button>
          <button type="submit" class="auction-btn primary">Enchérir</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const auctionsGrid = document.getElementById('auctionsGrid');
    const createAuctionModal = document.getElementById('createAuctionModal');
    const bidModal = document.getElementById('bidModal');

    // Load auctions
    async function loadAuctions() {
      try {
        const res = await fetch('/api/auctions');
        const data = await res.json();
        
        if (!res.ok) {
          auctionsGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: rgba(255,255,255,.5);">Erreur de chargement</div>';
          return;
        }

        if (data.auctions.length === 0) {
          auctionsGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: rgba(255,255,255,.5);">Aucune enchère en cours</div>';
          return;
        }

        auctionsGrid.innerHTML = data.auctions.map(auction => {
          const endTime = new Date(auction.end_time);
          const now = new Date();
          const timeLeft = endTime - now;
          const isEnding = timeLeft < 3600000; // Less than 1 hour

          return `
            <div class="auction-card">
              <div class="auction-image">
                ${auction.item_image ? `<img src="${auction.item_image}" alt="${auction.item_name}">` : '<span style="font-size: 3rem;">📦</span>'}
              </div>
              <div class="auction-name">${auction.item_name}</div>
              <div class="auction-description">${auction.description || 'Aucune description'}</div>
              <div class="auction-bid-info">
                <div>
                  <div class="auction-bid-label">Enchère actuelle</div>
                  <div class="auction-bid-value">${auction.current_bid}$</div>
                </div>
                <div>
                  <div class="auction-bid-label">Départ</div>
                  <div class="auction-bid-value" style="color: rgba(255,255,255,.7);">${auction.starting_bid}$</div>
                </div>
              </div>
              <div class="auction-timer ${isEnding ? 'ending' : ''}" data-end-time="${auction.end_time}">
        Temps restant: ${formatTimeLeft(timeLeft)}
      </div>
              <div class="auction-actions">
                <button class="auction-btn" onclick="viewAuction('${auction.id}')">Détails</button>
                <button class="auction-btn primary" onclick="openBidModal('${auction.id}', ${auction.current_bid}, ${auction.min_increment})">Enchérir</button>
              </div>
            </div>
          `;
        }).join('');

        // Update timers
        setInterval(updateTimers, 1000);
      } catch (err) {
        console.error('Error loading auctions:', err);
        auctionsGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: rgba(255,255,255,.5);">Erreur de chargement</div>';
      }
    }

    function formatTimeLeft(ms) {
      if (ms <= 0) return 'Terminé';
      const days = Math.floor(ms / 86400000);
      const hours = Math.floor((ms % 86400000) / 3600000);
      const minutes = Math.floor((ms % 3600000) / 23000);
      const seconds = Math.floor((ms % 60000) / 1000);
      
      if (days > 0) return `${days}j ${hours}h`;
      if (hours > 0) return `${hours}h ${minutes}m`;
      if (minutes > 0) return `${minutes}m ${seconds}s`;
      return `${seconds}s`;
    }

    function updateTimers() {
      document.querySelectorAll('.auction-timer').forEach(timer => {
        const endTime = new Date(timer.dataset.endTime);
        const now = new Date();
        const timeLeft = endTime - now;
        timer.textContent = 'Temps restant: ' + formatTimeLeft(timeLeft);
        
        if (timeLeft < 3600000 && timeLeft > 0) {
          timer.classList.add('ending');
        }
      });
    }

    // Create auction
    document.getElementById('createAuctionBtn').addEventListener('click', () => {
      if (!token) {
        alert('Vous devez être connecté pour créer une enchère');
        window.location.href = '/login';
        return;
      }
      createAuctionModal.classList.add('open');
    });

    document.getElementById('cancelCreate').addEventListener('click', () => {
      createAuctionModal.classList.remove('open');
    });

    document.getElementById('createAuctionForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const itemName = document.getElementById('itemName').value;
      const itemImage = document.getElementById('itemImage').value;
      const itemDescription = document.getElementById('itemDescription').value;
      const startingBid = parseInt(document.getElementById('startingBid').value);
      const minIncrement = parseInt(document.getElementById('minIncrement').value);
      const endTime = document.getElementById('endTime').value;

      try {
        const res = await fetch('/api/auctions/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            itemName,
            itemImage,
            description: itemDescription,
            startingBid,
            minIncrement,
            endTime
          })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.error || 'Erreur lors de la création');
          return;
        }

        createAuctionModal.classList.remove('open');
        document.getElementById('createAuctionForm').reset();
        loadAuctions();
      } catch (err) {
        alert('Erreur de connexion');
      }
    });

    // Bid
    window.openBidModal = function(auctionId, currentBid, minIncrement) {
      if (!token) {
        alert('Vous devez être connecté pour enchérir');
        window.location.href = '/login';
        return;
      }

      document.getElementById('bidAuctionId').value = auctionId;
      document.getElementById('currentBidDisplay').textContent = currentBid;
      document.getElementById('minBidDisplay').textContent = currentBid + minIncrement;
      document.getElementById('bidAmount').min = currentBid + minIncrement;
      document.getElementById('bidAmount').value = currentBid + minIncrement;
      bidModal.classList.add('open');
    };

    document.getElementById('cancelBid').addEventListener('click', () => {
      bidModal.classList.remove('open');
    });

    document.getElementById('bidForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const auctionId = document.getElementById('bidAuctionId').value;
      const amount = parseInt(document.getElementById('bidAmount').value);

      try {
        const res = await fetch('/api/auctions/bid', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ auctionId, amount })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.error || 'Erreur lors de l\'enchère');
          return;
        }

        bidModal.classList.remove('open');
        loadAuctions();
        alert('Enchère placée avec succès !');
      } catch (err) {
        alert('Erreur de connexion');
      }
    });

    // View auction details
    window.viewAuction = function(auctionId) {
      // Could implement a detail view modal
      alert('Détails de l\'enchère: ' + auctionId);
    };

    // Close modals on backdrop click
    createAuctionModal.addEventListener('click', (e) => {
      if (e.target === createAuctionModal) {
        createAuctionModal.classList.remove('open');
      }
    });

    bidModal.addEventListener('click', (e) => {
      if (e.target === bidModal) {
        bidModal.classList.remove('open');
      }
    });

    // Initial load
    loadAuctions();
  </script>
</body>
</html>
