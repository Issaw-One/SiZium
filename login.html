<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="shortcut icon" href="content.png" type="image/x-icon">
  <title>Connexion - SiZium Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(1000px 600px at 20% 10%,rgba(167,139,250,.20),transparent 60%),radial-gradient(900px 600px at 80% 30%,rgba(53,242,255,.12),transparent 55%),radial-gradient(900px 600px at 50% 90%,rgba(251,113,133,.10),transparent 60%),#070A12;
    }
    .auth-card {
      width: 100%;
      max-width:420px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
      animation: scaleIn .4s ease both;
    }
    .auth-logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      margin: 0 auto 20px;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(53,242,255,.25));
    }
    .auth-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: -.03em;
    }
    .auth-subtitle {
      color: rgba(255,255,255,.45);
      font-size: .9rem;
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .auth-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .auth-label {
      font-size: .92rem;
      color: rgba(234,240,255,.72);
      font-weight: 600;
    }
    .auth-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(7,10,18,.55);
      border: 1px solid rgba(255,255,255,.14);
      color: var(--text);
      outline: none;
      font-family: inherit;
      font-size: 1rem;
      transition: border-color .2s, box-shadow .2s;
    }
    .auth-input:focus {
      border-color: rgba(53,242,255,.4);
      box-shadow: 0 0 0 3px rgba(53,242,255,.08);
    }
    .auth-btn {
      border: 0;
      cursor: pointer;
      padding: 14px 16px;
      border-radius: 14px;
      color: var(--text);
      background: linear-gradient(135deg,rgba(53,242,255,.22),rgba(167,139,250,.22));
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      font-weight: 700;
      font-family: inherit;
      font-size: 1rem;
      transition: transform .15s ease, box-shadow .15s, filter .15s;
    }
    .auth-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 35px rgba(0,0,0,.4);
      filter: brightness(1.1);
    }
    .auth-btn:active {
      transform: translateY(1px);
      box-shadow: none;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,.12);
    }
    .auth-divider span {
      color: rgba(255,255,255,.4);
      font-size: .85rem;
    }
    .discord-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #5865F2;
      color: #fff;
      border: none;
      padding: 14px 16px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background .2s, transform .15s;
      text-decoration: none;
    }
    .discord-btn:hover {
      background: #4752C4;
      transform: translateY(-1px);
    }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      color: rgba(255,255,255,.5);
      font-size: .9rem;
    }
    .auth-footer a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .auth-error {
      background: rgba(239,68,68,.15);
      border: 1px solid rgba(239,68,68,.3);
      color: #fca5a5;
      padding: 12px;
      border-radius: 12px;
      font-size: .9rem;
      text-align: center;
      display: none;
    }
    .auth-error.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <img src="baf6edb7f1fdbf9518edb15ce85740c6.webp" alt="SiZium" class="auth-logo">
      <div class="auth-title">SiZium Shop</div>
      <div class="auth-subtitle">Connecte-toi pour accéder à ton compte</div>
      
      <div class="auth-error" id="authError"></div>
      
      <form class="auth-form" id="loginForm">
        <div class="auth-field">
          <label class="auth-label">Email</label>
          <input type="email" class="auth-input" id="email" placeholder="ton@email.com" required>
        </div>
        <div class="auth-field">
          <label class="auth-label">Mot de passe</label>
          <input type="password" class="auth-input" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="auth-btn">Se connecter</button>
      </form>
      
      <div class="auth-divider">
        <span>ou</span>
      </div>
      
      <a href="/api/auth/discord" class="discord-btn">
        <svg width="24" height="24" viewBox="0 0 127.14 96.36" fill="#fff">
          <path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45 65.69C36.18 65.69 31 60 31 53s5-12.74 11.43-12.74S54 46 53.89 53s-5.05 12.69-11.44 12.69Zm42.24 0C78.41 65.69 73.25 60 73.25 53s5-12.74 11.44-12.74S96.23 46 96.12 53s-5.04 12.69-11.43 12.69Z"/>
        </svg>
        Continuer avec Discord
      </a>
      
      <div class="auth-footer">
        Pas encore de compte ? <a href="/signup">Créer un compte</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('authError');
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (!res.ok) {
          errorEl.textContent = data.error || 'Erreur de connexion';
          errorEl.classList.add('show');
          return;
        }
        
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/';
      } catch (err) {
        errorEl.textContent = 'Erreur de connexion au serveur';
        errorEl.classList.add('show');
      }
    });
  </script>
</body>
</html>
