<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="shortcut icon" href="content.png" type="image/x-icon">
  <title>Choisir le service - SiZium Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="style.css">
  <style>
    .services-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(1000px 600px at 20% 10%,rgba(167,139,250,.20),transparent 60%),radial-gradient(900px 600px at 80% 30%,rgba(53,242,255,.12),transparent 55%),radial-gradient(900px 600px at 50% 90%,rgba(251,113,133,.10),transparent 60%),#070A12;
    }
    .services-content {
      text-align: center;
      max-width: 600px;
      width: 100%;
    }
    .services-logo {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      margin: 0 auto 24px;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(53,242,255,.25));
      animation: scaleIn .5s ease both;
    }
    .services-title {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: -.03em;
      animation: fadeInUp .5s .1s ease both;
    }
    .services-subtitle {
      color: rgba(255,255,255,.45);
      font-size: 1rem;
      margin-bottom: 40px;
      animation: fadeInUp .5s .2s ease both;
    }
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      animation: fadeInUp .5s .3s ease both;
    }
    .service-card {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      padding: 32px 24px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s;
      position: relative;
      overflow: hidden;
    }
    .service-card:hover:not(.locked) {
      transform: translateY(-4px);
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
      border-color: rgba(53,242,255,.3);
    }
    .service-card.locked {
      opacity: .5;
      cursor: not-allowed;
    }
    .service-card.locked::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 10px,
        rgba(0,0,0,.1) 10px,
        rgba(0,0,0,.1) 20px
      );
    }
    .service-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    .service-icon.coral {
      background: linear-gradient(135deg, #FF6B6B, #ff8a8a);
      box-shadow: 0 0 30px rgba(255,107,107,.4);
    }
    .service-icon.mongolie {
      background: linear-gradient(135deg, #22c55e, #4ade80);
      box-shadow: 0 0 30px rgba(34,197,94,.4);
    }
    .service-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }
    .service-subtitle {
      color: rgba(255,255,255,.5);
      font-size: .9rem;
      margin-bottom: 16px;
    }
    .service-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      font-size: .8rem;
      color: rgba(255,255,255,.7);
      font-weight: 600;
    }
    .lock-message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(4px);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }
    .lock-message-text {
      color: rgba(255,255,255,.8);
      font-size: .9rem;
      font-weight: 600;
    }
    .lock-message-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    .loading-state {
      text-align: center;
      padding: 40px;
      color: rgba(255,255,255,.5);
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,.12);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 16px;
    }
    .discord-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      padding: 12px 20px;
      border-radius: 12px;
      background: #5865F2;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: background .2s;
    }
    .discord-link-btn:hover {
      background: #4752C4;
    }
  </style>
</head>
<body>
  <div class="services-container">
    <div class="services-content">
      <img src="baf6edb7f1fdbf9518edb15ce85740c6.webp" alt="SiZium" class="services-logo">
      <div class="services-title">SiZium Shop</div>
      <div class="services-subtitle">Choisissez votre service pour accéder au catalogue</div>
      
      <div id="servicesLoading" class="loading-state">
        <div class="loading-spinner"></div>
        <div>Vérification de vos accès...</div>
      </div>
      
      <div class="services-grid" id="servicesGrid" style="display:none;">
        <div class="service-card" onclick="selectService('coral')">
          <div class="service-icon coral">🪸</div>
          <div class="service-name">Coral</div>
          <div class="service-subtitle">Shop SiZium</div>
          <div class="service-badge">Accès libre</div>
        </div>
        
        <div class="service-card" id="mongolieCard">
          <div class="service-icon mongolie">🇲🇳</div>
          <div class="service-name">Mongolie Country</div>
          <div class="service-subtitle">Espace pays</div>
          <div class="service-badge">Accès restreint</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    
    // Check if user is logged in
    if (!token) {
      window.location.href = '/login';
    }

    // Check Discord roles for country access
    async function checkCountryAccess() {
      try {
        const res = await fetch('/api/users/discord-roles', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        
        const data = await res.json();
        
        document.getElementById('servicesLoading').style.display = 'none';
        document.getElementById('servicesGrid').style.display = 'grid';
        
        const mongolieCard = document.getElementById('mongolieCard');
        
        if (data.hasCountryAccess) {
          mongolieCard.onclick = () => selectService('mongolie');
        } else {
          mongolieCard.classList.add('locked');
          mongolieCard.innerHTML = `
            <div class="service-icon mongolie">🇲🇳</div>
            <div class="service-name">Mongolie Country</div>
            <div class="service-subtitle">Espace pays</div>
            <div class="service-badge">Accès restreint</div>
            <div class="lock-message">
              <div class="lock-message-icon">🔒</div>
              <div class="lock-message-text">
                Vous devez être connecté à Discord et avoir le rôle pays pour accéder à ce service
              </div>
              <a href="/api/auth/discord" class="discord-link-btn">
                <svg width="18" height="18" viewBox="0 0 127.14 96.36" fill="#fff">
                  <path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45 65.69C36.18 65.69 31 60 31 53s5-12.74 11.43-12.74S54 46 53.89 53s-5.05 12.69-11.44 12.69Zm42.24 0C78.41 65.69 73.25 60 73.25 53s5-12.74 11.44-12.74S96.23 46 96.12 53s-5.04 12.69-11.43 12.69Z"/>
                </svg>
                Lier Discord
              </a>
            </div>
          `;
        }
      } catch (err) {
        console.error('Error checking country access:', err);
        document.getElementById('servicesLoading').innerHTML = '<div>Erreur de vérification</div>';
      }
    }

    function selectService(service) {
      localStorage.setItem('selectedService', service);
      window.location.href = '/';
    }

    // Check on load
    checkCountryAccess();
  </script>
</body>
</html>
