<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="shortcut icon" href="content.png" type="image/x-icon">
  <title>SiZium Shop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    /* Toggle DC / Unité */
    .modeToggle {
      display: flex;
      background: rgba(0,0,0,.3);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      overflow: hidden;
      font-size: 0.8rem;
      margin-bottom: 8px;
    }
    .modeToggle button {
      flex: 1;
      padding: 6px 8px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,.5);
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
      font-size: 0.8rem;
      line-height: 1.3;
    }
    .modeToggle button.active {
      background: rgba(255,255,255,.14);
      color: #fff;
    }
    .modeToggle button:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="wrap">
      <div class="brand">
        <img src="baf6edb7f1fdbf9518edb15ce85740c6.webp" alt="Palazone" class="logo">
        <div>SiZium<br><span class="small"></span></div>
      </div>
      <div class="actions">
        <div class="pill">🧩 <span id="itemsCount">0</span> item(s)</div>
        <button class="btn" id="openCart">🛒 Panier</button>
      </div>
    </div>
  </div>

  <section class="main">
    <aside class="panel side">
      <div class="panelTitle">Filtres <button class="btn secondary" id="reset">Réinitialiser</button></div>

      <div class="field">
        <div class="label">Recherche</div>
        <input class="input" id="q" placeholder="Rechercher un item..." />
      </div>

      <div class="field">
        <div class="label">Catégories</div>
        <div class="chips" id="cats"></div>
      </div>

      <div class="field">
        <div class="label">Prix</div>
        <div class="rangeRow small"><span id="minLabel">0</span><span id="maxLabel">50000</span></div>
        <input type="range" id="min" min="0" max="50000" value="0" />
        <input type="range" id="max" min="0" max="50000" value="50000" />
      </div>
    </aside>

    <main class="panel content">
      <div class="toolbar">
        <div class="count">📦 <span id="shown">0</span> produit(s)</div>
        <div class="row">
          <button class="btn secondary" id="toTop">⬆️ Haut</button>
          <button class="btn" id="orderBtn">✅ Commander</button>
        </div>
      </div>

      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" style="display:none">Aucun produit ne correspond aux filtres.</div>
    </main>
  </section>

  <!-- Drawer panier -->
  <div class="overlay" id="overlay"></div>
  <div class="drawer" id="drawer">
    <div class="drawerHeader">
      <div style="font-weight:900">🛒 Ton panier</div>
      <button class="btn secondary" id="closeCart">Fermer</button>
    </div>

    <div class="drawerBody">
      <div class="label">Pseudo Minecraft</div>
      <input class="input" id="username" placeholder="Ex: Issaw" />

      <div style="margin-top:10px">
        <div class="label">Pseudo Discord</div>
        <input class="input" id="discordPseudo" placeholder="Ex: issaw" />
      </div>

      <div style="margin-top:10px">
        <div class="label">Note (optionnel)</div>
        <textarea class="input" id="note" rows="3" placeholder="Disponibilités, précisions..."></textarea>
      </div>

      <div style="height:12px"></div>
      <div class="label">Lignes</div>
      <div id="cartLines" class="small muted">Panier vide.</div>

      <div class="totalsBox">
        <div><b>Total $ :</b> <span id="totalDollar">0</span></div>
      </div>

      <div id="msg" class="small" style="margin-top:10px"></div>
    </div>

    <div class="drawerFooter">
      <button class="btn" id="send">Ouvrir le ticket Discord</button>
      <div class="small muted" style="margin-top:8px">Le ticket sert à confirmer le paiement en jeu et organiser la livraison.</div>
    </div>
  </div>

<script>
const BIN_ID = "6941efa5ae596e708f9f0079";
const ACCESS_KEY = "$2a$10$LaVFI31CpQpIVZygqrZgUOiudBxq.r9DXaAeMIUKcM7qkKEHyf3pK";

let ITEMS = [];

async function loadItemsFromJsonBin() {
  const url = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;
  const res = await fetch(url, {
    headers: { "Content-Type": "application/json", "X-Access-Key": ACCESS_KEY }
  });
  if (!res.ok) throw new Error("JSONBin error: " + res.status);
  const data = await res.json();
  const record = data.record;
  if (!record || !Array.isArray(record.items))
    throw new Error("Format JSON invalide : attendu { items: [...] }");
  ITEMS = record.items.filter(item => item.hidden !== true);
}

// Panier: key = `${id}|${mode}` (mode = "unite" | "dc")
const cart = new Map();
// Mode sélectionné par carte
const selectedMode = {};

let activeCat = "Tous";

const $ = id => document.getElementById(id);
const grid = $("grid"), empty = $("empty"), shownEl = $("shown");
const itemsCountEl = $("itemsCount"), catsEl = $("cats");
const qEl = $("q"), minEl = $("min"), maxEl = $("max");
const minLabel = $("minLabel"), maxLabel = $("maxLabel");
const overlay = $("overlay"), drawer = $("drawer");
const cartLines = $("cartLines"), totalDollarEl = $("totalDollar"), msgEl = $("msg");

function openCart()  { overlay.style.display="block";  drawer.style.transform="translateX(0)";   renderCart(); }
function closeCart() { overlay.style.display="none";   drawer.style.transform="translateX(100%)"; }

// Helpers item
function hasDC(it)    { return it.dcEnabled !== false    && it.prices?.["dc"] !== undefined; }
function hasUnite(it) { return it.uniteEnabled !== false && it.prices?.["$"]  !== undefined; }
function priceDC(it)    { return it.prices?.["dc"] ?? 0; }
function priceUnite(it) { return it.prices?.["$"]  ?? 0; }
function labelDC(it)    { return it.dcLabel    || "DC"; }
function labelUnite(it) { return it.uniteLabel || "Unité"; }

function uniqCats() { return ["Tous", ...new Set(ITEMS.map(i=>i.cat))]; }

function renderCats() {
  catsEl.innerHTML = uniqCats().map(c =>
    `<div class="chip ${c===activeCat?"active":""}" data-cat="${c}">${c}</div>`
  ).join("");
  catsEl.querySelectorAll(".chip").forEach(ch => {
    ch.addEventListener("click", () => { activeCat=ch.dataset.cat; renderCats(); renderProducts(); });
  });
}

function getFilters() {
  return { q: qEl.value.trim().toLowerCase(), min: +minEl.value, max: +maxEl.value, cat: activeCat };
}

function renderProducts() {
  const { q, min, max, cat } = getFilters();

  const filtered = ITEMS.filter(it => {
    if (q && !(it.name.toLowerCase().includes(q) || (it.desc||"").toLowerCase().includes(q))) return false;
    if (cat !== "Tous" && it.cat !== cat) return false;
    const hasAny = hasUnite(it) || hasDC(it);
    if (!hasAny) return true;
    const matchPrice =
      (hasUnite(it) && priceUnite(it) >= min && priceUnite(it) <= max) ||
      (hasDC(it)    && priceDC(it)    >= min && priceDC(it)    <= max);
    return matchPrice;
  });

  shownEl.textContent = filtered.length;
  if (!filtered.length) { grid.innerHTML=""; empty.style.display="block"; return; }
  empty.style.display = "none";

  grid.innerHTML = filtered.map(it => {
    // Mode par défaut
    if (!selectedMode[it.id]) selectedMode[it.id] = hasUnite(it) ? "unite" : "dc";
    const mode = selectedMode[it.id];
    const curPrice = mode==="dc" ? priceDC(it) : priceUnite(it);
    const bothAvail = hasDC(it) && hasUnite(it);

    return `
    <div class="card">
      <div class="cardInner">
        <div class="thumb">
          ${it.img
            ? `<img src="${it.img}" alt="${it.name}" onerror="this.outerHTML='<div class=\\'fallback\\'>Image manquante</div>'">`
            : `<div class="fallback">Aucune image</div>`}
        </div>
        <div class="cardTop">
          <div class="name">${it.name}</div>
          <div class="tag">${it.tag}</div>
        </div>
        <div class="desc">${it.desc}</div>

        ${/* Affiche le toggle seulement si au moins un mode dispo */ (hasDC(it) || hasUnite(it)) ? `
        <div class="modeToggle">
          <button type="button"
            class="${mode==='unite'?'active':''}"
            ${!hasUnite(it)?'disabled':''}
            data-mode-btn="${it.id}" data-mode="unite">
            📦 ${labelUnite(it)}
          </button>
          <button type="button"
            class="${mode==='dc'?'active':''}"
            ${!hasDC(it)?'disabled':''}
            data-mode-btn="${it.id}" data-mode="dc">
            🗄️ ${labelDC(it)}
          </button>
        </div>` : ''}

        <div class="modeRow">
          <div class="qtyPicker">
            <button type="button" class="qtyBtn" data-qdec="${it.id}">−</button>
            <input class="qtyInput" type="number" min="1" step="1" value="1" data-qty="${it.id}">
            <button type="button" class="qtyBtn" data-qinc="${it.id}">+</button>
          </div>
          <div class="pricePreview" id="price-${it.id}">${curPrice} $</div>
        </div>

        <button class="add" data-add="${it.id}">+ Ajouter au panier</button>
      </div>
    </div>`;
  }).join("");

  // Toggle mode
  grid.querySelectorAll("[data-mode-btn]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-mode-btn");
      const newMode = btn.getAttribute("data-mode");
      const it = ITEMS.find(x=>x.id===id);
      selectedMode[id] = newMode;

      grid.querySelectorAll(`[data-mode-btn="${id}"]`).forEach(b =>
        b.classList.toggle("active", b.getAttribute("data-mode")===newMode)
      );

      const qty = Math.max(1, +grid.querySelector(`[data-qty="${id}"]`)?.value || 1);
      const price = newMode==="dc" ? priceDC(it) : priceUnite(it);
      const el = $("price-"+id);
      if (el) el.textContent = `${price*qty} $`;
    });
  });

  // Quantité
  grid.querySelectorAll("[data-qty]").forEach(inp => {
    const id = inp.getAttribute("data-qty");
    const it = ITEMS.find(x=>x.id===id);
    const sync = () => {
      let v = Math.max(1, Math.floor(+inp.value||1));
      inp.value = v;
      const mode = selectedMode[id] || "unite";
      const price = mode==="dc" ? priceDC(it) : priceUnite(it);
      $("price-"+id).textContent = `${price*v} $`;
    };
    sync();
    inp.addEventListener("input", sync);
    inp.addEventListener("change", sync);
  });

  grid.querySelectorAll("[data-qinc]").forEach(b => {
    b.addEventListener("click", () => {
      const id = b.getAttribute("data-qinc");
      const inp = grid.querySelector(`[data-qty="${id}"]`);
      inp.value = String((+inp.value||1)+1);
      inp.dispatchEvent(new Event("change"));
    });
  });
  grid.querySelectorAll("[data-qdec]").forEach(b => {
    b.addEventListener("click", () => {
      const id = b.getAttribute("data-qdec");
      const inp = grid.querySelector(`[data-qty="${id}"]`);
      inp.value = String(Math.max(1,(+inp.value||1)-1));
      inp.dispatchEvent(new Event("change"));
    });
  });

  // Add to cart
  grid.querySelectorAll("[data-add]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-add");
      const it = ITEMS.find(x=>x.id===id);
      const mode = selectedMode[id] || "unite";
      const unitPrice = mode==="dc" ? priceDC(it) : priceUnite(it);
      const qty = Math.max(1, Math.floor(+grid.querySelector(`[data-qty="${id}"]`).value||1));
      const modeLabel = mode==="dc" ? labelDC(it) : labelUnite(it);
      const key = `${id}|${mode}`;

      const existing = cart.get(key);
      if (existing) existing.qty += qty;
      else cart.set(key, { id, name: it.name, mode, modeLabel, unitPrice, qty });

      syncCount();
    });
  });
}

function syncCount() {
  let n = 0;
  for (const [,l] of cart) n += l.qty;
  itemsCountEl.textContent = n;
}

function renderCart() {
  if (!cart.size) {
    cartLines.innerHTML = `<div class="muted">Panier vide.</div>`;
    totalDollarEl.textContent = "0";
    return;
  }
  let total = 0;
  const lines = [];
  for (const [key, line] of cart.entries()) {
    const lt = line.unitPrice * line.qty;
    total += lt;
    lines.push(`
      <div class="line">
        <div>
          <b>${line.name}</b>
          <div class="small muted">${line.unitPrice} $ • ${line.modeLabel} • x${line.qty}</div>
        </div>
        <div class="qtyBtns">
          <button class="mini" data-dec="${key}">−</button>
          <button class="mini" data-inc="${key}">+</button>
        </div>
      </div>`);
  }
  cartLines.innerHTML = lines.join("");
  totalDollarEl.textContent = String(total);

  cartLines.querySelectorAll("[data-inc]").forEach(b => {
    b.addEventListener("click", () => { cart.get(b.getAttribute("data-inc")).qty+=1; syncCount(); renderCart(); });
  });
  cartLines.querySelectorAll("[data-dec]").forEach(b => {
    b.addEventListener("click", () => {
      const key = b.getAttribute("data-dec");
      const line = cart.get(key);
      line.qty -= 1;
      if (line.qty<=0) cart.delete(key);
      syncCount(); renderCart();
    });
  });
}

function showMsg(text, type) {
  msgEl.textContent = text;
  msgEl.className = "small "+(type==="err"?"err":type==="ok"?"ok":"muted");
}

async function sendOrder() {
  const username = $("username").value.trim();
  const discordPseudo = $("discordPseudo").value.trim();
  const note = $("note").value || "";
  if (!username) return showMsg("❌ Mets ton pseudo en jeu.", "err");
  if (!discordPseudo) return showMsg("❌ Mets ton pseudo Discord.", "err");
  if (!cart.size) return showMsg("❌ Ton panier est vide.", "err");

  let total = 0;
  const items = [];
  for (const [, line] of cart.entries()) {
    const lt = line.unitPrice * line.qty;
    total += lt;
    items.push({ id: line.id, name: line.name, mode: line.modeLabel, qty: line.qty, price: line.unitPrice, total: lt });
  }

  showMsg("⏳ Création du ticket Discord...", "muted");

  const res = await fetch("/api/create-ticket", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pseudo: username, discordPseudo, note, items, totalDollar: total })
  });

  const data = await res.json().catch(()=>({}));
  if (!res.ok || !data.ok)
    return showMsg("❌ Erreur: "+(data.error||"impossible de créer le ticket"), "err");

  cart.clear(); syncCount(); renderCart();
  const id = data.orderId || data.channelId || "?";
  const name = data.channelName ? ` (${data.channelName})` : "";
  showMsg("✅ Ticket créé ! ID: "+id+name, "ok");
}

// Events
$("openCart").addEventListener("click", openCart);
$("closeCart").addEventListener("click", closeCart);
overlay.addEventListener("click", closeCart);
$("orderBtn").addEventListener("click", openCart);
$("send").addEventListener("click", sendOrder);
$("toTop").addEventListener("click", ()=>window.scrollTo({top:0,behavior:"smooth"}));
$("reset").addEventListener("click", ()=>{
  qEl.value=""; minEl.value=0; maxEl.value=50000;
  activeCat="Tous"; minLabel.textContent="0"; maxLabel.textContent="50000";
  renderCats(); renderProducts();
});
minEl.addEventListener("input", ()=>{
  if(+minEl.value>+maxEl.value) minEl.value=maxEl.value;
  minLabel.textContent=minEl.value; renderProducts();
});
maxEl.addEventListener("input", ()=>{
  if(+maxEl.value<+minEl.value) maxEl.value=minEl.value;
  maxLabel.textContent=maxEl.value; renderProducts();
});
qEl.addEventListener("input", renderProducts);

(async()=>{
  try {
    await loadItemsFromJsonBin();
    renderCats(); renderProducts(); syncCount();
  } catch(e) {
    console.error(e);
    $("empty").style.display="block";
    $("empty").textContent="Impossible de charger les articles (JSONBin).";
  }
})();
</script>
</body>
</html>
